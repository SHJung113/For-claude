name: Build apps

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Same signing key for every build, so updates install over the old app.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=listenup
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/listenup.apk
      - uses: actions/upload-artifact@v4
        with:
          name: listenup-android-apk
          path: app/build/listenup.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/listenup-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: listenup-windows
          path: app/build/listenup-windows.zip

  # Publish both files as a GitHub Release so the phone can download the APK
  # directly from a fixed link:
  #   https://github.com/SHJung113/For-claude/releases/latest/download/listenup.apk
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ListenUp build ${{ github.run_number }}
          body: |
            커밋 ${{ github.sha }} 에서 자동 빌드.
            - Android: listenup.apk
            - Windows: listenup-windows.zip (압축 해제 후 listenup.exe 실행)
          make_latest: "true"
          files: |
            dist/listenup.apk
            dist/listenup-windows.zip
