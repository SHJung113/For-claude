L20-N-001: ["안녕하십니까.", "여름이 점점 더워지면서, 더 많은 도시들이 가장 오래된 도구 중 하나인 나무에 눈을 돌리고 있습니다.", "특파원이 자세히 전합니다.", "7월 오후, 이 거리의 아스팔트는 맨발에 화상을 입을 만큼 뜨거워질 수 있습니다.", "불과 몇 블록 떨어진 오래된 참나무 줄 아래는 눈에 띄게 더 시원합니다.", "연구자들은 이 차이를 도시 열섬 효과라고 부릅니다.", "포장도로와 지붕은 낮 동안 열을 흡수했다가 밤에 천천히 내보내기 때문에, 그늘이 거의 없는 동네는 해가 진 뒤에도 한참 동안 더운 상태로 남을 수 있습니다.", "예전에는 나무를 장식으로 생각했어요.", "이제는 수도관이나 전선 같은 기반 시설로 다룹니다.", "건강한 나무 그늘은 거리를 식히고 공기를 깨끗하게 하고, 솔직히 사람들이 밖을 걷고 싶게 만들어요.", "하지만 심는 건 쉬운 부분입니다.", "어린나무는 제대로 된 그늘을 만들기까지 물과 관리, 그리고 몇 년간의 성장이 필요하고, 나무가 가장 필요한 동네일수록 나무를 심을 공간이 가장 부족한 경우가 많습니다.", "인도 틈새에 묘목 하나 꽂아 두고 그냥 가 버리면 안 돼요.", "20년짜리 약속이니까요.", "그래도 이곳 시 지도자들은 계산은 간단하다고 말합니다.", "살아남는 나무 한 그루 한 그루가 전에는 없던 그늘을 조금씩 만들어 낸다는 것입니다.", "시내에서 클레어 휴즈였습니다."]
